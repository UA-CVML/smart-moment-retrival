model:
  arch: blip2_mr
  model_type: pretrain_flant5xl
  load_finetuned: false
  use_grad_checkpoint: false
  freeze_vit: true
  task: qformer_freeze_lora
  input_time_format: seconds_integers
  interleave_data: true
  frame_token_aggregation: false
  stc_ablation_mode: full_stc
  keyframe_topk: 32
  use_audio: true
  beats_checkpoint: checkpoints/BEATs_iter3.pt
datasets:
  qvh:
    vis_processor:
      train:
        name: blip2_video_train
        n_frms: 80
        image_size: 224
      eval:
        name: blip_video_eval
        n_frms: 80
        image_size: 224
    text_processor:
      train:
        name: blip_question
        max_words: 50
      eval:
        name: blip_question
        max_words: 50
run:
  task: moment_retrieval
  lr_sched: linear_warmup_cosine_lr
  init_lr: 3e-4
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 2255
  weight_decay: 0.05
  max_epoch: 50
  batch_size_train: 1
  batch_size_eval: 1
  num_workers: 8
  accum_grad_iters: 4
  max_len: 200
  min_len: 8
  num_beams: 5
  seed: 42
  output_dir: output/qvhighlights/train
  amp: true
  resume_ckpt_path: null
  evaluate: false
  train_splits:
  - train
  valid_splits:
  - val
  test_splits: []
  device: cuda
  world_size: 8
  dist_url: env://
  distributed: true
  use_dist_eval_sampler: true
  find_unused_parameters: true
  wandb: false
  wandb_project: SMART
  wandb_name: qvhighlights_train
